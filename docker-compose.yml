services:
  postgres:
    image: postgres:16-alpine
    container_name: aleo-foundry-db
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: aleo_foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d aleo_foundry"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
