services:
  postgres:
    image: postgres:16-alpine
    container_name: aleo-foundry-db
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: aleo_foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d aleo_foundry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    container_name: aleo-foundry-redpanda
    ports:
      - "9092:9092"
    entrypoint: /bin/bash
    command:
      - -c
      - >
        exec rpk redpanda start --overprovisioned --smp 1 --memory 512M
        --reserve-memory 0M --node-id 0 --check=false
        --kafka-addr PLAIN://0.0.0.0:9092
        --advertise-kafka-addr PLAIN://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-clean -t 5"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
